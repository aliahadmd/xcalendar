plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.xcalendaralarm'
version = '0.1.0'

// Shizuku: ADB-privileged binder access (used for the XMSF network workaround).
dependencies {
  implementation 'dev.rikka.shizuku:api:13.1.5'
  implementation 'dev.rikka.shizuku:provider:13.1.5'
}

android {
  namespace "expo.modules.xcalendaralarm"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    aidl true
  }
  lintOptions {
    abortOnError false
  }
}
